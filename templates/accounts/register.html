{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="auth-section">
  <div class="container">
    <div class="auth-card">
      <h1>ساخت حساب کاربری</h1>
      <p class="sub">با ثبت‌نام، سریع‌تر خرید کنید و سفارش‌هایتان را پیگیری کنید.</p>
      <form action="{% url 'accounts:register' %}" method="post">
        {% csrf_token %}
        <div class="form-field"><label>نام و نام خانوادگی</label><input name="fullname" required placeholder="نام شما"></div>
        <div class="form-field"><label>ایمیل</label><input type="email" name="email" required placeholder="[email protected]"></div>
        <div class="form-field"><label>رمز عبور</label><input type="password" name="password1" required placeholder="حداقل 8 کاراکتر"></div>
        <div class="form-field"><label>تکرار رمز عبور</label><input type="password" name="password2" required placeholder="حداقل 8 کاراکتر"></div>
        <p class="form-error" id="register-error"></p>
        <button type="submit" class="btn btn-primary btn-block">ثبت‌نام</button>
      </form>
      <p class="auth-foot">قبلاً ثبت‌نام کرده‌اید؟ <a href="{% url 'accounts:login' %}">ورود به حساب</a></p>
    </div>
  </div>
</section>
{% endblock %}
