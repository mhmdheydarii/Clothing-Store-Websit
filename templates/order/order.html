{% extends 'base.html' %}
{% load static %}
{% block content %}

<!-- PAGE HEADER -->
<section class="page-header">
  <div class="container">
    <div class="breadcrumb">
      <a href="{% url 'website:index' %}">خانه</a> /
      <a href="{% url 'cart:cart-products' %}">سبد خرید</a> /
      تکمیل سفارش
    </div>
    <h1>تکمیل سفارش</h1>
  </div>
</section>


<!-- CHECKOUT -->
<section class="checkout-section">
  <div class="container">
    <div class="checkout-layout">

      <!-- ==================== FORM ==================== -->
      <div>
        <!-- آدرس -->
        <form method="post" id="order-form">
          <!-- csrf_token اینجا -->
          {% csrf_token %}
          <fieldset class="checkout-form">
            <legend>آدرس تحویل</legend>

            <div class="form-row">
              <div class="form-field">
                <label>نام گیرنده</label>
                <input type="text" name="fullname" placeholder="نام و نام خانوادگی" required>
              </div>
              <div class="form-field">
                <label>شماره موبایل</label>
                <input type="tel" name="phone_number" placeholder="۰۹xxxxxxxxx" required>
              </div>
            </div>

            <div class="form-field">
              <div class="form-field">
                <label>استان</label>
                <input type="text" name="state" placeholder="نام استان" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label>شهر</label>
                <input type="text" name="city" placeholder="نام شهر" required>
              </div>
              <div class="form-field">
                <label>کد پستی</label>
                <input type="text" name="zip_code" placeholder="۱۰ رقمی" required>
              </div>
            </div>

            <div class="form-field">
              <label>آدرس کامل</label>
              <textarea name="address" rows="3" placeholder="خیابان، کوچه، پلاک، واحد..." required></textarea>
            </div>

            <input type="hidden" name="coupon" id="coupon-hidden">

          </fieldset>
        </form>
        <!-- کد تخفیف -->
        <fieldset class="checkout-form" style="margin-top:10px;">
          <legend>کد تخفیف</legend>
          <div class="promo-row">
            <input type="text" name="coupon" id="coupon" placeholder="کد تخفیف خود را وارد کنید">
            <button type="button" name="action" value="apply_promo" class="btn btn-dark"
              style="padding:12px 20px; white-space:nowrap;" onclick="ValidateCoupon()">
              اعمال کد
            </button>
          </div>
        </fieldset>

        <!--
          <fieldset class="checkout-form" style="margin-top:10px;">
            <legend>روش ارسال</legend>
            <div class="payment-options">
              <label>
                <input type="radio" name="shipping" value="post" checked>
                پست پیشتاز — ۳ تا ۵ روز کاری (رایگان)
              </label>
              <label>
                <input type="radio" name="shipping" value="express">
                ارسال اکسپرس — ۱ روز کاری (۵۰٬۰۰۰ تومان)
              </label>
            </div>
          </fieldset> روش ارسال -->

        <!-- دکمه رفتن به پرداخت -->
        <button type="submit" name="action" form="order-form" value="goto_payment" class="btn btn-primary btn-block"
          style="margin-top:24px;">
          ادامه و رفتن به درگاه پرداخت
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"
            style="margin-right:6px;">
            <line x1="19" y1="12" x2="5" y2="12" />
            <polyline points="12 19 5 12 12 5" />
          </svg>
        </button>

      </div>
      <!-- /FORM -->


      <!-- ==================== SUMMARY ==================== -->
      <div style="border-top:1px solid #ede8e0; padding-top:14px;">
        <div class="summary-row">
          <span>جمع کالاها</span>
          <!-- از بک‌اند -->
          <span class="formatted-price">{{total_price}}</span>
        </div>
        <div class="summary-row">
          <span>هزینهٔ ارسال</span>
          <span>رایگان</span>
        </div>
        <div class="summary-row total">
          <span>مبلغ قابل پرداخت</span>
          <!-- از بک‌اند -->
          <span class="formatted-price" id="total_price">{{total_price}}</span>
        </div>
      </div>

      <a href="{% url 'cart:cart-products' %}"
        style="display:block; text-align:center; margin-top:14px; font-size:13px; color:#8a8275;">
        بازگشت به سبد خرید
      </a>
      </aside>
      <!-- /SUMMARY -->

    </div>
  </div>
</section>
<script>
  function ApplyDiscount(total_price, total_tax, final_price) {
    $("#total_price").html(total_price);

    formatPriceInToman(document.getElementById("total_price"))
    formatPriceInToman(document.getElementById("final_price"))
  }

  function ValidateCoupon() {
    $.ajax({
      url: '{% url "order:validate-coupon" %}',
      type: 'POST',
      data: {
        coupon: $("#coupon").val(),
        csrfmiddlewaretoken: '{{ csrf_token }}'
      },
      success: function (response) {
        console.log(response);
        alert(response.message);
        $("#coupon-hidden").val($("#coupon").val());
        ApplyDiscount(response.total_price, response.final_price);
      },
      error: function (xhr, status, error) {
        console.error(error);
        $("#coupon-hidden").val("");
      }
    });
  }
</script>
{% endblock %}
