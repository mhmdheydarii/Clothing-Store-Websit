{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<div class="container dash-layout">


  <section class="dash-main">
    <div class="dash-header">
      <h1>پروفایل کاربری</h1>
      <p>اطلاعات حساب کاربری خود را مشاهده و ویرایش کنید.</p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="dash-alert {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form class="dash-card dash-form" id="profile-form" method="post" action="#">
      {% csrf_token %}

      <div class="dash-card-header">
        <h2>اطلاعات شخصی</h2>
        <button type="button" class="btn-outline" id="profile-edit-toggle">ویرایش</button>
      </div>

      <div class="dash-form-grid">
        <div class="form-field">
          <label for="first_name">نام</label>
          <input type="text" id="first_name" name="first_name" value="{{ request.user.first_name }}" disabled>
        </div>

        <div class="form-field">
          <label for="last_name">نام خانوادگی</label>
          <input type="text" id="last_name" name="last_name" value="{{ request.user.last_name }}" disabled>
        </div>

        <div class="form-field">
          <label for="phone_number">شماره موبایل</label>
          <input type="tel" id="phone_number" name="phone_number" value="{{ request.user.phone_number }}" disabled>
        </div>

        <div class="form-field">
          <label for="email">ایمیل</label>
          <input type="email" id="email" name="email" value="{{ request.user.email }}" disabled>
        </div>
      </div>

      <div class="dash-form-actions" id="profile-form-actions" hidden>
        <button type="submit" class="btn-primary">ذخیره تغییرات</button>
        <button type="button" class="btn-ghost" id="profile-cancel-btn">انصراف</button>
      </div>
    </form>

  </section>
</div>
<script src="{% static 'js/main.js' %}"></script>
{% endblock %}
